<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">GitHub stats for Rahul Sahane</title>
<desc id="d">Total contributions, current and longest streak, commits by hour, and top languages by repository and by commit.</desc>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',Inter,system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
.tile,.fade{opacity:0;animation:fade .7s ease forwards}
.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
.seg{stroke-dasharray:0 427.26;animation:seg .9s ease forwards}
.ring{stroke-dashoffset:389.56;animation:ringin 1.2s cubic-bezier(.2,.8,.2,1) .4s forwards}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes seg{to{stroke-dasharray:var(--len) 427.26}}
@keyframes ringin{to{stroke-dashoffset:0.00}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tile,.fade{opacity:1}.bar{transform:none}.seg{stroke-dasharray:var(--len) 427.26}.ring{stroke-dashoffset:0.00}}
</style>
