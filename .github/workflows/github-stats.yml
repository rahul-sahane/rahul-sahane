name: Update GitHub stats card

on:
  schedule:
    - cron: "0 1 * * *"        # daily, 01:00 UTC
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    paths:
      - scripts/generate_stats.py
      - .github/workflows/github-stats.yml

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card
        env:
          GH_USERNAME: rahul-sahane
          # Optional: add a repo secret named STATS_TOKEN (a PAT with read:user)
          # to also count private contributions. Falls back to the default token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          DISPLAY_NAME: Rahul Sahane
          TAGLINE: Java Full Stack Developer
          STATS_TZ: Asia/Kolkata
        run: python scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update GitHub stats card"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

