name: Generate Empty-Cell Snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependency
        run: python -m pip install requests

      - name: Generate empty-cell snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          OUTPUT: dist/empty-snake.svg
        run: python scripts/empty_snake.py

      - name: Commit generated animation
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist/empty-snake.svg"
          message: "Update empty-cell contribution snake"
